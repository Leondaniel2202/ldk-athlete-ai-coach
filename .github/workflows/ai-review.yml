name: AI Advisory Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  ai-review:
    name: AI Advisory Review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Truncate to 600 lines then cap at 24000 bytes to stay within the
          # model's 8000-token request limit. Line count alone is insufficient
          # because long lines and the surrounding prompt (system instructions,
          # PR title, and PR body) also consume tokens.
          # This is intentionally best-effort: large PRs will have their diff
          # clipped. The review is partial / advisory only and never blocks merging.
          gh pr diff ${{ github.event.pull_request.number }} \
            | head -n 600 \
            | head -c 24000 \
            > /tmp/pr_diff.txt

      - name: Read diff into env
        run: |
          DELIM="$(uuidgen)"
          {
            echo "PR_DIFF<<${DELIM}"
            cat /tmp/pr_diff.txt
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

      - name: Run AI advisory review
        id: ai-review
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are an expert software architect and code reviewer for a monorepo with a
            Python FastAPI backend and a Next.js/React frontend.

            Project context:
            This is an athlete AI coach system moving into V2 with a backend/frontend monorepo.
            The backend lives in backend/ and uses FastAPI, PostgreSQL, SQLAlchemy, Pydantic,
            Notion sync, and domain/application/API/AI layers. It mirrors structured Notion data
            into PostgreSQL, exposes resource/context/AI endpoints, and uses application context
            services as the boundary between structured data and AI analysis.

            The frontend lives in frontend/ and uses Next.js, React, TypeScript, app routes,
            components, hooks, lib/api, typed API models, unit/integration tests, and e2e tests.
            It consumes backend APIs and should remain aligned with backend-owned contracts.

            Review priorities:
            1. Does the change respect monorepo boundaries and avoid mixing unrelated backend and
               frontend work?
            2. Backend: persistence, validation, business logic, metrics, status logic, and AI
               context construction are backend-owned. Business logic should not live in API
               routers.
            3. Backend: Notion-specific fetch/extract/map/sync concerns must stay isolated from
               domain logic. Domain logic should not depend on raw external payloads or Notion
               shapes.
            4. Backend: settings, database engines, and external clients should not be initialized
               unsafely at import time.
            5. Frontend: the app consumes backend APIs and should not duplicate backend business
               logic, metrics rules, status rules, or AI context construction.
            6. Frontend: API calls should go through frontend/lib/api. Reusable non-UI logic belongs
               in frontend/lib. React UI belongs in frontend/components. Routes/pages in
               frontend/app should stay thin and compose components/services.
            7. Frontend: generic UI belongs in frontend/components/ui. Feature-specific UI belongs
               in folders such as frontend/components/dashboard.
            8. API contracts: backend response schemas and frontend TypeScript API types should stay
               aligned. Frontend should handle loading, error, and empty states where relevant.
            9. Tests should be added at the correct level: backend unit/integration/API tests and
               frontend unit/integration/e2e tests.
            10. Does the change introduce unnecessary coupling, broad refactors, overengineering,
                missing edge cases, or data-quality issues?

            Do not nitpick formatting unless CI would fail.
            Do not suggest broad refactors unless they are directly relevant to this PR.
            This review is advisory only and must not imply that merging is blocked by the workflow
            itself.

            Return your response in this format:
            ## AI Advisory Review

            **Summary**
            <brief description of the change>

            **Blocking Concerns**
            <issues that should be addressed before merging, or "None">

            **Non-blocking Suggestions**
            <optional improvements, or "None">

            **Test Gaps**
            <missing or weak tests, or "None">

            **Merge Recommendation**
            <one of: Looks good / Review suggested / Changes needed>

            ---
            *This is an advisory review only. It is not a required check and does not block merging.*
          prompt: |
            Review this pull request.

            PR title: ${{ github.event.pull_request.title }}
            PR description: ${{ github.event.pull_request.body }}

            Diff:
            ${{ env.PR_DIFF }}

      - name: Post advisory review comment
        uses: actions/github-script@v7
        env:
          AI_REVIEW: ${{ steps.ai-review.outputs.response }}
        with:
          script: |
            // Stable HTML marker so subsequent runs update the same comment
            // instead of posting a new one on every synchronize event.
            const MARKER = '<!-- ai-advisory-review -->';
            const review = `${MARKER}\n${process.env.AI_REVIEW}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: review,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: review,
              });
            }
